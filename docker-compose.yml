services:
  pgdatabase:
    image: pgvector/pgvector:pg18
    container_name: exbb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exbb
    volumes:
      - exbb_pgdata:/var/lib/postgresql

volumes:
  exbb_pgdata:
